events {}

http {
    # Запрос попадает в зону своего канала: в другой зоне его ключ пустой и не учитывается.
    # Без заголовка Client-Type или с неизвестным значением — лимит мобильного приложения.
    map $http_client_type $web_limit_key {
        web     $binary_remote_addr;
        default "";
    }

    map $http_client_type $mobile_limit_key {
        web     "";
        default $binary_remote_addr;
    }

    limit_req_zone $web_limit_key    zone=web:10m    rate=50r/s;
    limit_req_zone $mobile_limit_key zone=mobile:10m rate=30r/s;
    limit_req_status 429;

    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;

        location /api/ {
            limit_req zone=web    burst=10 nodelay;
            limit_req zone=mobile burst=6  nodelay;
            proxy_pass http://backend;
            error_page 429 = @too_many_requests;
        }

        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error": "too_many_requests"}';
        }
    }

    # Тестовый сервер для имитации бэкенда приложения
    server {
        listen 8081;

        location /api/ {
            add_header Content-Type application/json;

            # Эмулируем разное поведение в зависимости от заголовка
            if ($http_client_type = "web") {
                return 200 '{"status": "success", "service": "web_backend", "data": "Web application response"}';
            }
            if ($http_client_type = "mobile") {
                return 200 '{"status": "success", "service": "mobile_backend", "data": "Mobile application response"}';
            }

            # Дефолтный ответ
            return 200 '{"status": "success", "service": "default_backend", "data": "Default response"}';
        }
    }
}
